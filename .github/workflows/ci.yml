name: Nekod CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          npm install
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy strict lint check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace test suite
        run: cargo test --workspace

      - name: Validate example manifests & trainer package
        run: |
          cargo run -p nekod-validator -- game schemas/examples/game-manifest.example.json
          cargo run -p nekod-validator -- trainer schemas/examples/trainer-manifest.example.json
          cargo run -p nekod-validator -- registry schemas/examples/registry-manifest.example.json
          cargo run -p nekod-validator -- patch schemas/examples/declarative-patch.example.json
          cargo run -p nekod-validator -- package examples/sample-singleplayer-rpg

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
