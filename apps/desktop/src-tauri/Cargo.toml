[package]
name = "nekod-desktop"
description = "L1 Tauri 2 desktop application shell for Nekod."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "nekod_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
nekod-core.workspace = true
nekod-game-detection.workspace = true
nekod-manifest.workspace = true
nekod-permission-manager.workspace = true
nekod-profile-manager.workspace = true
nekod-registry-client.workspace = true
nekod-runtime-api.workspace = true
nekod-trainer-manager.workspace = true
nekod-trainer-runtime.workspace = true
nekod-validator.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11", features = ["tray-icon"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
serde_json.workspace = true
tauri = { version = "2.11", features = ["test"] }
